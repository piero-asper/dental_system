name: dental-system

services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    env_file:
      - ./frontend/.env
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
